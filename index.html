<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Madagascar Connections</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game">
      <div class="flag" aria-label="Madagaskar Flagge">🇲🇬</div>
      <h1>MADAGASCAR</h1>
      <h2>CONNECTIONS</h2>

      <p>Crée 4 groupes de 4 mots</p>

      <div id="solved-area" aria-live="polite"></div>

      <div class="grid" id="grid" aria-label="Wortgitter"></div>

      <div class="status-row">
        <div id="lives" class="lives">Essais restants: ● ● ● ●</div>
        <button id="restart" class="secondary" type="button">essayer un autre fois</button>
      </div>

      <button id="check" class="check" type="button">vérifier</button>
    </main>

    <script src="script.js"></script>
  </body>
</html>
